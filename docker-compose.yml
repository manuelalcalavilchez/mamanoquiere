# Mamanoquiere: base de datos + API + web/app
# En EasyPanel: crear un servicio "Compose" con este archivo y asignar el dominio al servicio "web" (puerto 80).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mamanoquiere}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-mamanoquiere}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mamanoquiere}"]
      interval: 10s
      retries: 5

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mamanoquiere}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mamanoquiere}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      ROOT_PATH: /api
      MEDIA_DIR: /data/media
      CORS_ORIGINS: ${PUBLIC_URL:-http://localhost:8080}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      EVOLUTION_URL: ${EVOLUTION_URL:-}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-}
    volumes:
      - media:/data/media

  web:
    build: ./web
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "${WEB_PORT:-8080}:80"   # en EasyPanel puedes quitar esta línea y usar el dominio del panel

volumes:
  pgdata:
  media:
