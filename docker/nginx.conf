# Imagen única: sirve la web/app (SPA) y pasa /api y /media a la API interna (127.0.0.1:8000).
# Puertos: 80 (principal) y 3000 (el que usaba la web de la versión Directus, para no tener que
# cambiar el túnel ni el dominio). El 8055 (antiguo CRM Directus) lleva a la app de gestión.
server {
    listen 80 default_server;
    listen 3000;
    server_name _;
    include /etc/nginx/mmq-app.conf;
}

server {
    listen 8055;
    server_name _;
    absolute_redirect off;   # el túnel/proxy está delante: Location relativa, sin :8055 ni http
    location = / { return 302 /app/; }
    location /admin { return 302 /app/; }
    include /etc/nginx/mmq-app.conf;
}
