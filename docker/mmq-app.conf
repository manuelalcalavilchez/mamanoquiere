# Rutas comunes de la web/app (incluido desde nginx.conf)
root /usr/share/nginx/html;
client_max_body_size 45m;   # adjuntos del formulario y vídeo de portada

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;

add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Permissions-Policy "camera=(self), geolocation=()" always;

location /api/ {
    proxy_pass http://127.0.0.1:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}
# Fotos públicas (trabajos del portfolio, portada y logo): Nginx las sirve directamente del volumen.
# Los nombres son únicos, así que se pueden cachear mucho tiempo.
location /media/trabajos/ {
    # Caché corta: una foto borrada deja de servirse (también desde Cloudflare) en ~1 h
    alias /data/media/trabajos/;
    expires 1h;
    add_header Cache-Control "public";
    add_header X-Content-Type-Options nosniff always;
}
location /media/web/ {
    alias /data/media/web/;
    expires 30d;
    add_header Cache-Control "public";
    add_header X-Content-Type-Options nosniff always;
}
# Cualquier otro /media pasa por la API. La API está montada con root_path=/api,
# así que su servidor de ficheros solo responde bajo /api/media/ (con /media/ daba 404).
location /media/ {
    proxy_pass http://127.0.0.1:8000/api/media/;
    proxy_set_header Host $host;
}
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}
location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
}
